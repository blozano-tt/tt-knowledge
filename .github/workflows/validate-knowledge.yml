name: Validate knowledge corpus

on:
  pull_request:
    paths:
      - 'tt-knowledge/**'
      - 'scripts/**'
      - 'upstream-sources.json'
      - '.gitmodules'
      - '.github/workflows/validate-knowledge.yml'
  push:
    branches: [main]
    paths:
      - 'tt-knowledge/**'
      - 'scripts/**'
      - 'upstream-sources.json'
      - '.gitmodules'
      - '.github/workflows/validate-knowledge.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate verified metadata
        run: python scripts/prepare_knowledge.py
      - name: Test upstream source validation
        run: python -m unittest discover -s scripts/tests
