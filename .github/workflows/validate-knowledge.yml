name: Validate knowledge corpus

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate approved sources and ingestion failure handling
        run: |
          python scripts/prepare_knowledge.py
          python -m unittest discover -s scripts/tests
          python -m unittest discover -s deploy/tests -p 'test_ingest.py'
          bash -n deploy/*.sh
          python -m py_compile deploy/test-mcp.py deploy/scripts/*.py scripts/*.py
      - name: Test actual public proxy configuration
        env:
          DOMAIN: knowledge.example.com
          POSTGRES_PASSWORD: disposable-test-password
        run: |
          export UI_PASSWORD_HASH="$(printf '%s\n' 'test-password' | docker run --rm -i caddy:2-alpine caddy hash-password --algorithm bcrypt --bcrypt-cost 4)"
          docker compose -f deploy/compose.yaml config --quiet
          docker compose -f deploy/compose.yaml run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker compose -f deploy/compose.yaml run --rm --no-deps --entrypoint nginx gateway -t
          trap 'docker compose -f deploy/tests/compose.yaml down -v' EXIT
          docker compose -f deploy/tests/compose.yaml up -d hindsight gateway caddy
          docker compose -f deploy/tests/compose.yaml run --rm test
