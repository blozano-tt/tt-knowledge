name: Validate knowledge corpus

on:
  pull_request:
    paths:
      - 'tt-knowledge/**'
      - 'scripts/**'
      - 'deploy/**'
      - 'site/**'
      - 'upstream-sources.json'
      - '.gitmodules'
      - '.dockerignore'
      - '.github/workflows/validate-knowledge.yml'
  push:
    branches: [main]
    paths:
      - 'tt-knowledge/**'
      - 'scripts/**'
      - 'deploy/**'
      - 'site/**'
      - 'upstream-sources.json'
      - '.gitmodules'
      - '.dockerignore'
      - '.github/workflows/validate-knowledge.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate verified metadata
        run: python scripts/prepare_knowledge.py
      - name: Validate Docker build inputs
        # A small base exercises every COPY and the build-context allowlist.
        # The full pinned MemPalace image is tested during deployment.
        run: docker build -f deploy/Dockerfile --build-arg MEMPALACE_IMAGE=python:3.12-alpine -t tt-knowledge-build-check .
      - name: Test upstream source validation
        run: python -m unittest discover -s scripts/tests
      - name: Test public MCP policy
        run: |
          pip install jsonschema==4.26.0
          python -m unittest discover -s deploy/tests -p 'test_public*.py'
      - name: Test public proxy limits
        run: |
          trap 'docker compose -f deploy/tests/compose.yaml down -v' EXIT
          docker compose -f deploy/tests/compose.yaml up -d mempalace gateway caddy
          docker compose -f deploy/tests/compose.yaml run --rm test
      - name: Validate deployment configuration
        env:
          DOMAIN: knowledge.example.com
        run: |
          bash -n deploy/rebuild-index.sh deploy/update.sh deploy/status.sh
          python -m py_compile deploy/test-mcp.py deploy/scripts/*.py scripts/*.py
          node --check site/site.js
          docker compose -f deploy/compose.yaml config --quiet
          docker compose -f deploy/compose.yaml run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker compose -f deploy/compose.yaml run --rm --no-deps --entrypoint nginx gateway -t
