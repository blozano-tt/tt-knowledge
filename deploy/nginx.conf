worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 512; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 16k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 15s;

    # Only Caddy shares the ingress network; it overwrites X-Real-IP with the
    # socket peer address. Client-supplied forwarding headers cannot bypass limits.
    limit_req_zone $http_x_real_ip zone=per_ip_rate:10m rate=120r/m;
    limit_req_zone $server_name zone=global_rate:1m rate=300r/m;
    limit_conn_zone $http_x_real_ip zone=per_ip_active:10m;
    limit_conn_zone $server_name zone=global_active:1m;
    limit_req_status 429;
    limit_conn_status 429;

    # Resolve again after Docker recreates Hindsight during an index rebuild.
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8080;
        server_name gateway;
        set $hindsight http://hindsight:8888;
        error_page 429 = @limited;
        location @limited {
            default_type application/json;
            add_header Retry-After 5 always;
            return 429 '{"error":"Too many requests; retry with backoff"}';
        }
        location ~ ^/mcp/?$ {
            limit_req zone=per_ip_rate burst=30 nodelay;
            limit_req zone=global_rate burst=50 nodelay;
            limit_conn per_ip_active 2;
            limit_conn global_active 4;
            proxy_pass $hindsight/mcp/tt-knowledge/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_real_ip;
            proxy_set_header Authorization "";
            proxy_set_header X-Bank-Id "";
            proxy_set_header Connection "close";
            proxy_request_buffering on;
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
            proxy_send_timeout 10s;
        }
        location = /healthz {
            limit_req zone=per_ip_rate burst=5 nodelay;
            proxy_pass $hindsight/health;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }
        location / { return 404; }
    }
}
