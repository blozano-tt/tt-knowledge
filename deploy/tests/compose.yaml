name: tt-knowledge-limits-test
services:
  mempalace:
    image: python:3.12-alpine
    command: [python, /tests/test_gateway.py, backend]
    volumes:
      - .:/tests:ro
  gateway:
    image: ${NGINX_IMAGE:-nginx:1.30.5-alpine}
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on: [mempalace]
    volumes:
      - ../nginx.conf:/etc/nginx/nginx.conf:ro
  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    environment:
      DOMAIN: http://caddy
    depends_on: [gateway]
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../site:/srv:ro
  test:
    image: python:3.12-alpine
    profiles: [tools]
    command: [python, /tests/test_gateway.py]
    volumes:
      - .:/tests:ro
