name: tt-knowledge

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.2-pg17}
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: hindsight
      POSTGRES_DB: hindsight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run deploy/setup.sh first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U hindsight -d hindsight']
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 45s

  hindsight:
    # Stock upstream image. No custom application build or runtime patches.
    image: ${HINDSIGHT_IMAGE:-ghcr.io/vectorize-io/hindsight:0.10.0}
    restart: unless-stopped
    logging: *logging
    environment:
      HINDSIGHT_API_DATABASE_URL: postgresql://hindsight:${POSTGRES_PASSWORD}@postgres:5432/hindsight
      HINDSIGHT_API_LLM_PROVIDER: none
      HINDSIGHT_API_RETAIN_EXTRACTION_MODE: chunks
      HINDSIGHT_API_STORE_DOCUMENT_TEXT: 'true'
      HINDSIGHT_API_ENABLE_OBSERVATIONS: 'false'
      HINDSIGHT_API_ENABLE_TEMPORAL_RETRIEVAL: 'false'
      HINDSIGHT_API_ENABLE_GRAPH_RETRIEVAL: 'false'
      HINDSIGHT_API_MCP_ENABLED_TOOLS: recall,get_document,list_documents
      HINDSIGHT_API_MCP_STATELESS: 'true'
      HINDSIGHT_API_MCP_INSTRUCTIONS: >-
        This bank is the public blozano-tt/tt-knowledge catalogue.
        Recall finds candidate chunks; use each result's document_id with get_document
        to read the original Markdown before answering. Cite metadata.source_url.
        For architecture-specific questions use tags [arch:wormhole-b0] or [arch:blackhole-a0]
        with tags_match=all_strict. Shared ISA documents use scope:isa-shared.
        Never infer absence or lack of exceptions from a retrieved chunk alone.
      HINDSIGHT_API_RECALL_MAX_CONCURRENT: '2'
      HINDSIGHT_API_RETAIN_MAX_CONCURRENT: '1'
      HINDSIGHT_API_EMBEDDINGS_LOCAL_FORCE_CPU: 'true'
      HINDSIGHT_API_RERANKER_LOCAL_FORCE_CPU: 'true'
      HINDSIGHT_API_RERANKER_LOCAL_MAX_CONCURRENT: '1'
      # Bound cross-encoder work on the 2-CPU VM using upstream configuration.
      HINDSIGHT_API_RERANKER_MAX_CANDIDATES: '64'
      HINDSIGHT_API_RERANKER_MAX_CANDIDATES_LOW: '32'
      HINDSIGHT_API_RERANKER_MAX_CANDIDATES_HIGH: '96'
      HINDSIGHT_API_WORKER_ID: tt-knowledge
      HINDSIGHT_API_LOG_LEVEL: warning
      # The entire dashboard is protected by Caddy's HTTP authentication.
      HINDSIGHT_CP_DATAPLANE_API_URL: http://127.0.0.1:8888
    volumes:
      - model-cache:/home/hindsight/.cache
    networks: [backend, edge]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python3, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8888/health", timeout=5)']
      interval: 10s
      timeout: 10s
      start_period: 180s
      retries: 10
    stop_grace_period: 45s

  ingest:
    image: python:3.12-alpine
    profiles: [tools]
    entrypoint: [python, /scripts/ingest.py]
    environment:
      HINDSIGHT_URL: http://hindsight:8888
    volumes:
      - ../.build:/corpus:ro
      - ./scripts/ingest.py:/scripts/ingest.py:ro
    networks: [backend]
    depends_on:
      hindsight:
        condition: service_healthy

  gateway:
    image: ${NGINX_IMAGE:-nginx:1.30.5-alpine}
    restart: unless-stopped
    logging: *logging
    user: '101:101'
    entrypoint: [nginx, -g, 'daemon off;']
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [ingress, backend]
    depends_on:
      hindsight:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 10s
      retries: 3

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    logging: *logging
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
      UI_PASSWORD_HASH: ${UI_PASSWORD_HASH:?run deploy/setup.sh first}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge, ingress, backend]
    depends_on:
      gateway:
        condition: service_healthy

networks:
  ingress:
    internal: true
  backend:
    internal: true
  edge:

volumes:
  postgres-data:
    name: tt-knowledge-hindsight-postgres
  model-cache:
    name: tt-knowledge-hindsight-model-cache
  caddy-data:
    name: tt-knowledge-caddy-data
  caddy-config:
    name: tt-knowledge-caddy-config
