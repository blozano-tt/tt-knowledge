name: tt-knowledge

x-mempalace-environment: &mempalace-environment
  MEMPALACE_BACKEND: qdrant
  MEMPALACE_QDRANT_URL: http://qdrant:6333
  MEMPALACE_QDRANT_NAMESPACE: tt-knowledge
  MEMPALACE_EMBEDDING_DEVICE: cpu

x-mempalace-volumes: &mempalace-volumes
  - mempalace-state:/data
  # Keep downloaded embedding models across clean state rebuilds.
  - mempalace-cache:/data/.cache

x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Repair mount-point ownership for existing volumes as well as fresh installs.
  # Application processes continue to run as the image's non-root user.
  volume-init:
    image: tt-knowledge-mempalace:local
    profiles: [tools]
    user: "0:0"
    network_mode: none
    entrypoint: ["chown", "1000:1000", "/data", "/data/.cache"]
    volumes: *mempalace-volumes

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.19.1}
    restart: unless-stopped
    logging: *bounded-logging
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - backend

  # One-shot tool. It is intentionally not started by a normal `compose up`.
  # deploy/rebuild-index.sh invokes it only after wiping MemPalace/Qdrant state.
  indexer:
    image: tt-knowledge-mempalace:local
    profiles: [tools]
    depends_on:
      - qdrant
    entrypoint: ["/bin/sh", "/opt/tt-knowledge/wait-and-mine.sh"]
    environment:
      <<: *mempalace-environment
    volumes: *mempalace-volumes
    networks:
      - backend
      # Allow the initial embedding-model download.
      - edge

  mempalace:
    image: tt-knowledge-mempalace:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        MEMPALACE_IMAGE: ${MEMPALACE_IMAGE:-ghcr.io/mempalace/mempalace:3.10.0}
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    logging: *bounded-logging
    depends_on:
      - qdrant
    entrypoint: ["python", "/opt/tt-knowledge/public-mcp.py"]
    command:
      - --transport
      - http
      - --host
      - "0.0.0.0"
      - --port
      - "8765"
      - --backend
      - qdrant
      - --read-only
    environment:
      <<: *mempalace-environment
      # Public access is bounded by the gateway and the retrieval-only entrypoint.
      MEMPALACE_MCP_HTTP_ALLOW_INSECURE_NO_TOKEN: "1"
      MEMPALACE_MCP_HTTP_TOKEN: ""
      MEMPALACE_MCP_EXTRA_ALLOWED_HOSTS: ${DOMAIN:?set DOMAIN in deploy/.env}
      MEMPALACE_MCP_IDLE_HOURS: "0"
    expose:
      - "8765"
    volumes: *mempalace-volumes
    networks:
      - backend
      - edge
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8765/healthz').read().strip()==b'ok' else sys.exit(1)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  gateway:
    image: ${NGINX_IMAGE:-nginx:1.30.5-alpine}
    restart: unless-stopped
    logging: *bounded-logging
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      mempalace:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ingress
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    logging: *bounded-logging
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../site:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
      - ingress

networks:
  ingress:
    internal: true
  backend:
    internal: true
  edge:

volumes:
  qdrant-data:
    name: tt-knowledge-qdrant-data
  mempalace-state:
    name: tt-knowledge-mempalace-state
  mempalace-cache:
    name: tt-knowledge-mempalace-cache
  caddy-data:
    name: tt-knowledge-caddy-data
  caddy-config:
    name: tt-knowledge-caddy-config
